webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "incognito", "disable-infobars", "disable-popup-blocking"]
    }
  }
}

serenity {
  project.name = "E2E Demoblaze - Serenity BDD + Cucumber + Screenplay"
  take.screenshots = FOR_EACH_ACTION
}